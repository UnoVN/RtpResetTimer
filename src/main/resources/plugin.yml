name: AntiArmorTrim
version: 2.4.0
main: com.server.antitrim.AntiArmorTrim
api-version: '1.21'
author: LeThienNhan
softdepend: [LuckPerms, Nexo]
description: Catppuccin Decoration Studio - Armor Trim, Nexo Custom Hats & Item Rename.

commands:
  antitrim:
    description: Admin command for AntiArmorTrim
    aliases: [at, vctrim]
    permission: armortrim.admin
  decor:
    description: Open the Decoration Studio Hub GUI
    aliases: [cosmetics, studio]
  trim:
    description: Open the Armor Trim Studio GUI
    aliases: [armortrim, trims]
  hat:
    description: Open the Custom Hat Studio GUI
    aliases: [hats, customhat]
  rename:
    description: Open the Item Rename Studio GUI or rename held item
    aliases: [itemrename]

permissions:
  armortrim.bypass:
    description: Allows owning, wearing, and using the Auto-Trim GUI Studio.
    default: op
  armortrim.hat:
    description: Allows equipping Nexo Custom Hats on Diamond and Netherite helmets.
    default: op
  armortrim.rename:
    description: Allows renaming items via the Rename Studio GUI or command.
    default: op
  armortrim.admin:
    description: Allows reloading config and managing Custom Hats via Admin GUI.
    default: op
