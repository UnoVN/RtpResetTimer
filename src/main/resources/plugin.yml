name: RtpResetTimer
version: '1.5.0'
main: com.server.rtpreset.RtpResetTimer
api-version: '1.21'
author: Nhan
softdepend: [PlaceholderAPI]
commands:
  rtpreset:
    description: Reset or reload RtpResetTimer configuration
    permission: rtpreset.admin
  setup:
    description: Open Arena Setup GUI for Boxcart mode
    permission: rtpreset.admin
  rtp:
    description: Open Random Teleport menu
    permission: rtpreset.use
  rtpq:
    description: Open 1v1 Battle Queue menu
    aliases: [rtpqueue]
    permission: rtpreset.use
  duel:
    description: Challenge a player to a 1v1 Duel
    permission: rtpreset.use
  forfeit:
    description: Forfeit current Arena match or leave queue
    aliases: [leave, ff]
    permission: rtpreset.use

permissions:
  rtpreset.admin:
    description: Admin permission for RtpResetTimer and Arena Setup
    default: op
  rtpreset.use:
    description: Allow all players to use /rtp, /rtpq, /duel, and /forfeit
    default: true
    
