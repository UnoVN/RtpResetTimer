# ╔════════════════════════════════════════════════════════════════════════════╗
# ║                  RTP RESET TIMER & 1V1 QUEUE CONFIGURATION                 ║
# ║                     Theme: Catppuccin Mocha (1.21.9+)                      ║
# ╠════════════════════════════════════════════════════════════════════════════╣
# ║  1.21.9+ SPRITE OBJECT COMPONENT REFERENCE:                                ║
# ║  • Items MUST use the 'items' atlas: <sprite:items:item/texture_name>      ║
# ║  • Blocks MUST use the 'blocks' atlas: <sprite:blocks:block/texture_name>  ║
# ║  Examples:                                                                 ║
# ║  • Crossbow:      <white><sprite:items:item/crossbow_standby></white>      ║
# ║  • Loaded C-Bow:  <white><sprite:items:item/crossbow_arrow></white>        ║
# ║  • Bow:           <white><sprite:items:item/bow></white>                   ║
# ║  • TNT Minecart:  <white><sprite:items:item/tnt_minecart></white>          ║
# ║  • End Crystal:   <white><sprite:items:item/end_crystal></white>           ║
# ║  • Totem:         <white><sprite:items:item/totem_of_undying></white>      ║
# ║  • Sand Block:    <white><sprite:blocks:block/sand></white>                ║
# ╚════════════════════════════════════════════════════════════════════════════╝


# ==============================================================================
# [1] SAFE LOBBY SPAWN
# ==============================================================================
lobby-spawn:
  world: "world"
  x: 157.5
  y: 115.0
  z: -5.5
  yaw: 90.0
  pitch: 0.0


# ==============================================================================
# [2] AUTOMATED WORLD RESET (SlimeWorldManager)
# ==============================================================================
worlds:
  desert:
    target-world: "rtpdesert"
    display-name: "RTP Desert"
    reset-interval-seconds: 1800

    worldborder:
      center-x: 420.0
      center-z: -455.0
      size: 838.0

    post-reset-commands:
      - "time set day"
      - "gamerule locator_bar false"
      - "gamerule doDaylightCycle true"


# ==============================================================================
# [3] SOLO RANDOM TELEPORT GUI (/rtp)
# ==============================================================================
rtp-menu:
  title: "&#89b4fa&lRANDOM TELEPORT"
  size: 27

  filler:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  items:
    desert:
      slot: 13
      material: "SAND"
      icon: "<white><sprite:blocks:block/sand></white>"
      name: "&#89dceb&lRTP Desert"
      lore:
        - "&#a6adc8Free-for-all combat arena"
        - "&#a6adc8Safe & flat terrain detection"
        - ""
        - "&#a6e3a1» Click to teleport randomly"
      world: "rtpdesert"
      min-x: 20
      max-x: 820
      min-z: -855
      max-z: -55


# ==============================================================================
# [4] 1V1 BATTLE QUEUE GUI (/rtpq or /rtpqueue)
# ==============================================================================
rtpq-menu:
  title: "&#fab387&l1V1 BATTLE QUEUE"
  size: 27
  countdown-seconds: 5
  player-gap: 8

  queue-timeout:
    enabled: true
    timeout-seconds: 120

  filler:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  countdown-titles:
    5: "&#f38ba8&l❺"
    4: "&#f38ba8&l❹"
    3: "&#fab387&l❸"
    2: "&#fab387&l❷"
    1: "&#a6e3a1&l❶"

  items:
    ht_kit:
      slot: 11
      material: "CROSSBOW"
      icon: "<white><sprite:items:item/crossbow_standby></white>"
      name: "&#fab387&lHT KIT (1v1)"
      mode-display: "HT KIT"
      map-display: "RTP Desert"
      lore:
        - "&#a6adc8High Tier Kit 1v1 Matchmaking"
        - "&#a6adc8Map: &#89dcebRTP Desert"
        - "&#a6adc8Players in Queue: &#fab387{current_queue}/2"
        - ""
        - "&#a6e3a1» Click to join or leave queue"
      world: "rtpdesert"
      min-x: 50
      max-x: 790
      min-z: -820
      max-z: -80

    lt_kit:
      slot: 15
      material: "BOW"
      icon: "<white><sprite:items:item/bow></white>"
      name: "&#89dceb&lLT KIT (1v1)"
      mode-display: "LT KIT"
      map-display: "RTP Desert"
      lore:
        - "&#a6adc8Low Tier Kit 1v1 Matchmaking"
        - "&#a6adc8Map: &#89dcebRTP Desert"
        - "&#a6adc8Players in Queue: &#89dceb{current_queue}/2"
        - ""
        - "&#a6e3a1» Click to join or leave queue"
      world: "rtpdesert"
      min-x: 50
      max-x: 790
      min-z: -820
      max-z: -80


# ==============================================================================
# [5] SMART SAFETY & ANTI-CRATER ALGORITHM
# ==============================================================================
rtp-settings:
  min-player-distance: 50.0
  max-terrain-slope: 2
  max-search-attempts: 60


# ==============================================================================
# [6] MESSAGES & BROADCASTS (100% English - Catppuccin Mocha)
# ==============================================================================
messages:
  prefix: "<glyph:warning_blue> "

  countdown-normal: "{prefix}&#89dcebReset map {display_name} in &#b4befe{time}"
  countdown-warning: "{prefix}&#89dcebReset map {display_name} in &#fab387{time}"
  countdown-urgent: "{prefix}&#f38ba8Reset map {display_name} in {time}"
  resetting: "{prefix}&#cba6f7Resetting {display_name} map..."
  player-teleported: "{prefix}&#89b4faYou were teleported to lobby because &#b4befe{display_name} &#89b4fais resetting!"
  reset-success: "{prefix}&#a6e3a1{display_name} has been successfully reset!"
  next-reset: "{prefix}&#89dcebReset map {display_name} in &#b4befe{time}"

  admin:
    no-permission: "{prefix}&#f38ba8You do not have permission to use this command!"
    reload-success: "{prefix}&#a6e3a1Configuration reloaded! Loaded &#89dceb{count} &#a6e3a1worlds."
    manual-reset-single: "{prefix}&#fab387Manually resetting {display_name}..."
    manual-reset-all: "{prefix}&#fab387Manually resetting all configured worlds..."
    world-not-found: "{prefix}&#f38ba8World not found! Available: &#89dceb{available}"
    no-worlds: "{prefix}&#f38ba8No worlds configured in config.yml!"

rtp-messages:
  # Chat Messages (Uses {prefix} ONLY - no {icon} next to prefix)
  joined-queue: "{prefix}&#89dcebYou joined the &#fab387{mode} &#89dcebqueue (&#a6e3a1{current}/2&#89dceb)!"
  left-queue: "{prefix}&#f38ba8You left the &#fab387{mode} &#f38ba8queue."
  not-in-queue: "{prefix}&#f38ba8You are not currently in any queue."
  already-in-other-queue: "{prefix}&#f38ba8You are already in another queue! Please leave it first."
  queue-broadcast: "{prefix}&#89b4faPlayer &#cba6f7{player} &#89b4fais queuing for &#fab387{mode} &#89b4fa(&#a6e3a1{current}/2&#89b4fa)! Use &#f9e2af/rtpq"
  queue-timeout: "{prefix}&#f38ba8You were removed from the &#fab387{mode} &#f38ba8queue due to inactivity ({timeout})."

  # Actionbars & Subtitles (No {prefix}, uses {icon} sprite cleanly)
  queue-waiting-actionbar: "{icon} &#89dcebQueue: &#fab387{mode} &8| &#89dcebElapsed: &#a6e3a1{elapsed} &8| &#a6adc8/rtpq leave"
  queue-timeout-actionbar: "{icon} &#f38ba8&lQUEUE TIMED OUT!"

  match-found-broadcast:
    - ""
    - " &8» &#fab387&l1V1 MATCH FOUND"
    - " &8» &#cba6f7{player1} &#f38ba8&lVS &#cba6f7{player2}"
    - " &8» &#89dcebMode: {icon} &#b4befe{mode} &8| &#89dcebMap: &#b4befe{map}"
    - ""

  match-actionbar: "{icon} &#89b4faOpponent: {opponent_prefix}&#cdd6f4{opponent_name} &8| &#89dcebStarting in: &#fab387{time}s"
  match-countdown-subtitle: "{icon} &#cdd6f4Prepare for battle..."
  match-started-title: "&#a6e3a1&lFIGHT!"
  match-started-subtitle: "{icon} &#cdd6f4Good luck!"

  # Teleport Chat Feedback (Uses {prefix} ONLY)
  teleporting-rtp: "{prefix}&#89dcebFinding a safe location in &#fab387{map}&#89dceb..."
  teleport-success: "{prefix}&#a6e3a1Teleported to &#89dcebX: {x}, Y: {y}, Z: {z}&#a6e3a1!"
  safe-loc-not-found: "{prefix}&#f38ba8Could not find a safe flat location, please try again!"
  
