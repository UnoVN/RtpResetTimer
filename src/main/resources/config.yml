# ==============================================================================
#             RTP RESET TIMER - CONFIGURATION (CATPPUCCIN MOCHA)
# ==============================================================================
# Color Reference:
#   Mauve:   &#cba6f7   Red:    &#f38ba8   Peach: &#fab387   Green: &#a6e3a1
#   Sky:     &#89dceb   Blue:   &#89b4fa   Text:  &#cdd6f4   Subtext: &#a6adc8
# ==============================================================================

lobby-spawn:
  world: "world"
  x: 157.5
  y: 115.0
  z: -5.5
  yaw: 90.0
  pitch: 0.0

messages:
  prefix: "<glyph:warning_blue> "
  countdown-normal: "{prefix}&#89dcebReset map {display_name} in &#b4befe{time}"
  countdown-warning: "{prefix}&#89dcebReset map {display_name} in &#fab387{time}"
  countdown-urgent: "{prefix}&#f38ba8Reset map {display_name} in {time}"
  resetting: "{prefix}&#cba6f7Resetting {display_name} map..."
  player-teleported: "{prefix}&#89b4faYou were teleported to lobby because &#b4befe{display_name} &#89b4fais resetting!"
  reset-success: "{prefix}&#a6e3a1{display_name} has been successfully reset!"
  next-reset: "{prefix}&#89dcebReset map {display_name} in &#b4befe{time}"
  admin:
    no-permission: "{prefix}&#f38ba8You do not have permission to use this command!"
    reload-success: "{prefix}&#a6e3a1Reloaded configuration! Loaded &#89dceb{count} &#a6e3a1worlds."
    manual-reset-single: "{prefix}&#fab387Manually resetting {display_name}..."
    manual-reset-all: "{prefix}&#fab387Manually resetting all configured worlds..."
    world-not-found: "{prefix}&#f38ba8World not found! Available: &#89dceb{available}"
    no-worlds: "{prefix}&#f38ba8No worlds configured in config.yml!"

worlds:
  desert:
    target-world: "rtpdesert"
    display-name: "RTP Desert"
    reset-interval-seconds: 1800
    worldborder:
      center-x: 420.0
      center-z: -455.0
      size: 838.0
    post-reset-commands:
      - "time set day"
      - "gamerule locator_bar false"
      - "gamerule doDaylightCycle true"

# ==============================================================================
#                       RTP MENU CONFIGURATION (/rtp)
# ==============================================================================
rtp-menu:
  title: "&#89b4fa&lRANDOM TELEPORT"
  size: 27
  items:
    desert:
      slot: 13
      material: "SAND"
      name: "&#89dceb&lRTP Desert"
      lore:
        - "&#a6adc8Free for all combat zone"
        - "&#a6adc8Safe random teleportation"
        - ""
        - "&#a6e3a1» Click to teleport randomly"
      world: "rtpdesert"
      min-x: 2
      max-x: 838
      min-z: -873
      max-z: -36

# ==============================================================================
#                 RTP QUEUE 1V1 MATCHMAKING MENU (/rtpq)
# ==============================================================================
rtpq-menu:
  title: "&#fab387&l1V1 BATTLE QUEUE"
  size: 27
  countdown-seconds: 5
  player-gap: 8
  items:
    ht_kit:
      slot: 11
      material: "CROSSBOW"
      name: "&#fab387&lHT KIT (1v1)"
      mode-display: "HT KIT"
      lore:
        - "&#a6adc8High Tier Kit matchmaking"
        - "&#a6adc8Map: &#89dcebRTP Desert"
        - "&#a6adc8Queue: &#fab387{current_queue}/2"
        - ""
        - "&#89dceb» Click to join or leave queue"
      world: "rtpdesert"
      min-x: 50
      max-x: 790
      min-z: -820
      max-z: -80

    lt_kit:
      slot: 15
      material: "BOW"
      name: "&#89dceb&lLT KIT (1v1)"
      mode-display: "LT KIT"
      lore:
        - "&#a6adc8Low Tier Kit matchmaking"
        - "&#a6adc8Map: &#89dcebRTP Desert"
        - "&#a6adc8Queue: &#89dceb{current_queue}/2"
        - ""
        - "&#89dceb» Click to join or leave queue"
      world: "rtpdesert"
      min-x: 50
      max-x: 790
      min-z: -820
      max-z: -80

# ==============================================================================
#                 RTP & MATCHMAKING SAFETY ALGORITHM SETTINGS
# ==============================================================================
rtp-settings:
  min-player-distance: 50.0
  max-terrain-slope: 2
  max-search-attempts: 60

# ==============================================================================
#                    MESSAGES FOR RTP & RTP QUEUE
# ==============================================================================
rtp-messages:
  joined-queue: "{prefix}&#89dcebYou joined the queue for &#fab387{display_name} &#89dceb(&#a6e3a1{current}/2&#89dceb)!"
  left-queue: "{prefix}&#f38ba8You left the queue for &#fab387{display_name}&#f38ba8."
  already-in-other-queue: "{prefix}&#f38ba8You are already in another queue! Please leave it first."
  queue-broadcast: "{prefix}&#89b4faPlayer &#cba6f7{player} &#89b4fais looking for a match in &#fab387{display_name}&#89b4fa! (&#a6e3a1{current}/2&#89b4fa)"
  
  match-found-broadcast:
    - ""
    - " &8» &#fab387&l1V1 MATCH FOUND"
    - " &8» &#cba6f7{player1} &#f38ba8VS &#cba6f7{player2}"
    - " &8» &#89dcebMode: &#b4befe{mode} &8| &#89dcebMap: &#b4befe{world}"
    - ""

  match-actionbar: "&#89b4faOpponent: {opponent_prefix}&#cdd6f4{opponent_name} &#89dceb| Starting in: &#fab387{time}s"
  match-countdown-subtitle: "&#cdd6f4Prepare for battle..."
  match-started-title: "&#a6e3a1&lFIGHT!"
  match-started-subtitle: "&#cdd6f4Good luck!"

  teleporting-rtp: "{prefix}&#89dcebFinding a safe location in &#fab387{display_name}&#89dceb..."
  teleport-success: "{prefix}&#a6e3a1Teleported to &#89dcebX: {x}, Y: {y}, Z: {z}&#a6e3a1!"
  safe-loc-not-found: "{prefix}&#f38ba8Could not find a safe location, please try again!"
  
