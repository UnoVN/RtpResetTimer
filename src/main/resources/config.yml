# ╔════════════════════════════════════════════════════════════════════════════╗
# ║               RTP RESET TIMER, 1V1 QUEUE & DUEL CONFIGURATION              ║
# ║                     Theme: Catppuccin Mocha (1.21.9+)                      ║
# ╠════════════════════════════════════════════════════════════════════════════╣
# ║  27-SLOT GUI LAYOUT REFERENCE (3 ROWS):                                    ║
# ║  Row 1: [ 0] [ 1] [ 2] [ 3] [ 4] [ 5] [ 6] [ 7] [ 8]  <-- Slot 4: Head     ║
# ║  Row 2: [ 9] [10] [11] [12] [13] [14] [15] [16] [17]  <-- Modes (11, 15)   ║
# ║  Row 3: [18] [19] [20] [21] [22] [23] [24] [25] [26]  <-- Slot 22: Confirm ║
# ╚════════════════════════════════════════════════════════════════════════════╝


# ==============================================================================
# [1] SAFE LOBBY SPAWN
# ==============================================================================
lobby-spawn:
  world: "world"
  x: 157.5
  y: 115.0
  z: -5.5
  yaw: 90.0
  pitch: 0.0


# ==============================================================================
# [2] AUTOMATED WORLD RESET (SlimeWorldManager)
# ==============================================================================
worlds:
  desert:
    target-world: "rtpdesert"
    display-name: "RTP Desert"
    reset-interval-seconds: 1800

    worldborder:
      center-x: 420.0
      center-z: -455.0
      size: 838.0

    post-reset-commands:
      - "time set day"
      - "gamerule locator_bar false"
      - "gamerule doDaylightCycle true"


# ==============================================================================
# [3] SOLO RANDOM TELEPORT GUI (/rtp)
# ==============================================================================
rtp-menu:
  title: "&#89b4fa&lRANDOM TELEPORT"
  size: 27

  filler:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  items:
    desert:
      slot: 13
      material: "SAND"
      icon: "<white><sprite:blocks:block/sand></white>"
      name: "{icon} &#89dceb&lRTP Desert"
      lore:
        - "&#a6adc8Free-for-all combat arena"
        - "&#a6adc8Safe & flat terrain detection"
        - ""
        - "<glyph:left_click> &#a6e3a1Click to teleport randomly"
      world: "rtpdesert"
      min-x: 20
      max-x: 820
      min-z: -855
      max-z: -55


# ==============================================================================
# [4] 1V1 BATTLE QUEUE GUI (/rtpq or /rtpqueue)
# Supports selecting multiple modes at once!
# ==============================================================================
rtpq-menu:
  title: "&#fab387&l1V1 BATTLE QUEUE"
  size: 27
  countdown-seconds: 5
  player-gap: 8

  queue-timeout:
    enabled: true
    timeout-seconds: 120

  filler:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  # Top-Center Player Info Head (Slot 4)
  player-head:
    slot: 4
    name: "&#fab387&lQUEUE PROFILE"
    lore:
      - "&#a6adc8Player: {player_prefix}&#cdd6f4{player_name}"
      - "&#a6adc8Selected: {selected_modes}"
      - "&#a6adc8Tip: &#89dcebSelect both modes to find a match faster!"

  status-selected: "&#a6e3a1✔ Selected"
  status-unselected: "<glyph:left_click> &#fab387Click to select mode"
  none-selected: "&#f38ba8None"

  # Bottom-Center Confirm Button (When joining or updating queue)
  confirm-button:
    slot: 22
    material: "LIME_CONCRETE"
    name: "&#a6e3a1&lCONFIRM & JOIN QUEUE"
    lore:
      - "&#a6adc8Selected Modes: {selected_modes}"
      - "&#a6adc8First mode to reach 2/2 starts the match!"
      - ""
      - "<glyph:left_click> &#a6e3a1Click to start queuing"

  # Bottom-Center Leave Button (Shown when already queuing)
  leave-button:
    slot: 22
    material: "RED_CONCRETE"
    name: "&#f38ba8&lLEAVE QUEUE"
    lore:
      - "&#a6adc8Currently Queuing: {selected_modes}"
      - ""
      - "<glyph:left_click> &#f38ba8Click to leave queue"

  countdown-titles:
    5: "&#f38ba8&l❺"
    4: "&#f38ba8&l❹"
    3: "&#fab387&l❸"
    2: "&#fab387&l❷"
    1: "&#a6e3a1&l❶"

  items:
    ht_kit:
      slot: 11
      material: "CROSSBOW"
      icon: "<white><sprite:items:item/crossbow_standby></white>"
      name: "{icon} &#fab387&lHT KIT (1v1)"
      mode-display: "HT KIT"
      map-display: "RTP Desert"
      lore:
        - "&#a6adc8High Tier Kit 1v1 Matchmaking"
        - "&#a6adc8Map: &#89dcebRTP Desert"
        - "&#a6adc8Players in Queue: &#fab387{current_queue}/2"
        - ""
        - "{queue_status}"
      world: "rtpdesert"
      min-x: 50
      max-x: 790
      min-z: -820
      max-z: -80

    lt_kit:
      slot: 15
      material: "BOW"
      icon: "<white><sprite:items:item/bow></white>"
      name: "{icon} &#89dceb&lLT KIT (1v1)"
      mode-display: "LT KIT"
      map-display: "RTP Desert"
      lore:
        - "&#a6adc8Low Tier Kit 1v1 Matchmaking"
        - "&#a6adc8Map: &#89dcebRTP Desert"
        - "&#a6adc8Players in Queue: &#89dceb{current_queue}/2"
        - ""
        - "{queue_status}"
      world: "rtpdesert"
      min-x: 50
      max-x: 790
      min-z: -820
      max-z: -80


# ==============================================================================
# [5] 1V1 PLAYER DUEL GUI (/duel <player>)
# ==============================================================================
duel-menu:
  title: "&#cba6f7&lDUEL: &#cdd6f4{target_name}"
  size: 27
  request-expire-seconds: 60

  filler:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  target-head:
    slot: 4
    name: "&#cba6f7&lOPPONENT INFO"
    lore:
      - "&#a6adc8Player: {target_prefix}&#cdd6f4{target_name}"
      - "&#a6adc8Selected Mode: {icon} &#fab387{mode}"
      - "&#a6adc8Arena Map: &#89dceb{map}"

  mode-lore:
    - "&#a6adc8Map: &#89dceb{map}"
    - ""
    - "{duel_status}"
  status-selected: "&#a6e3a1✔ Currently Selected"
  status-unselected: "<glyph:left_click> &#fab387Click to select this mode"

  send-button:
    slot: 22
    material: "LIME_CONCRETE"
    name: "&#a6e3a1&lSEND DUEL REQUEST"
    lore:
      - "&#a6adc8Opponent: {target_prefix}&#cdd6f4{target_name}"
      - "&#a6adc8Mode: {icon} &#fab387{mode}"
      - "&#a6adc8Map: &#89dceb{map}"
      - ""
      - "<glyph:left_click> &#a6e3a1Click to send duel request"


# ==============================================================================
# [6] SMART SAFETY & ANTI-CRATER ALGORITHM
# ==============================================================================
rtp-settings:
  min-player-distance: 50.0
  max-terrain-slope: 2
  max-search-attempts: 60


# ==============================================================================
# [7] MESSAGES & BROADCASTS (100% English - Catppuccin Mocha)
# ==============================================================================
messages:
  prefix: "<glyph:warning_blue> "

  countdown-normal: "{prefix}&#89dcebReset map {display_name} in &#b4befe{time}"
  countdown-warning: "{prefix}&#89dcebReset map {display_name} in &#fab387{time}"
  countdown-urgent: "{prefix}&#f38ba8Reset map {display_name} in {time}"
  resetting: "{prefix}&#cba6f7Resetting {display_name} map..."
  player-teleported: "{prefix}&#89b4faYou were teleported to lobby because &#b4befe{display_name} &#89b4fais resetting!"
  reset-success: "{prefix}&#a6e3a1{display_name} has been successfully reset!"
  next-reset: "{prefix}&#89dcebReset map {display_name} in &#b4befe{time}"

  admin:
    no-permission: "{prefix}&#f38ba8You do not have permission to use this command!"
    reload-success: "{prefix}&#a6e3a1Configuration reloaded! Loaded &#89dceb{count} &#a6e3a1worlds."
    manual-reset-single: "{prefix}&#fab387Manually resetting {display_name}..."
    manual-reset-all: "{prefix}&#fab387Manually resetting all configured worlds..."
    world-not-found: "{prefix}&#f38ba8World not found! Available: &#89dceb{available}"
    no-worlds: "{prefix}&#f38ba8No worlds configured in config.yml!"

rtp-messages:
  # Multi-Mode Queue Messages ({modes} automatically includes each mode's sprite & name)
  no-mode-selected: "{prefix}&#f38ba8Please select at least one mode before confirming!"
  joined-queue: "{prefix}&#89dcebYou joined the queue for: {modes}"
  left-queue: "{prefix}&#f38ba8You left the queue ({modes}&#f38ba8)."
  not-in-queue: "{prefix}&#f38ba8You are not currently in any queue."
  queue-broadcast: "{prefix}&#89b4faPlayer &#cba6f7{player} &#89b4fais queuing for {modes}&#89b4fa! Use &#f9e2af/rtpq"
  queue-timeout: "{prefix}&#f38ba8You were removed from the queue ({modes}&#f38ba8) due to inactivity ({timeout})."

  queue-waiting-actionbar: "&#89dcebQueue: {modes} &8| &#89dcebElapsed: &#a6e3a1{elapsed} &8| &#a6adc8/rtpq leave"
  queue-timeout-actionbar: "&#f38ba8&lQUEUE TIMED OUT!"

  match-found-broadcast:
    - ""
    - " &8» &#fab387&l1V1 MATCH FOUND"
    - " &8» &#cba6f7{player1} &#f38ba8&lVS &#cba6f7{player2}"
    - " &8» &#89dcebMode: {icon} &#b4befe{mode} &8| &#89dcebMap: &#b4befe{map}"
    - ""

  match-actionbar: "&#89dcebMode: {icon} &#fab387{mode} &8| &#89b4faOpponent: {opponent_prefix}&#cdd6f4{opponent_name} &8| &#fab387{time}s"
  match-countdown-subtitle: "&#cdd6f4Mode: {icon} &#fab387{mode}"
  match-started-title: "&#a6e3a1&lFIGHT!"
  match-started-subtitle: "&#cdd6f4Good luck!"

  teleporting-rtp: "{prefix}&#89dcebFinding a safe location in {icon} &#fab387{map}&#89dceb..."
  teleport-success: "{prefix}&#a6e3a1Teleported to &#89dcebX: {x}, Y: {y}, Z: {z}&#a6e3a1!"
  safe-loc-not-found: "{prefix}&#f38ba8Could not find a safe flat location, please try again!"

  # Duel System Messages
  duel-usage: "{prefix}&#89dcebUsage: &#fab387/duel <player> &#89dcebor &#fab387/duel <accept|deny> <player>"
  duel-player-not-found: "{prefix}&#f38ba8Player not found or is offline!"
  duel-self: "{prefix}&#f38ba8You cannot duel yourself!"
  duel-already-sent: "{prefix}&#f38ba8You already have a pending duel request to &#cba6f7{target}&#f38ba8!"
  duel-busy: "{prefix}&#f38ba8That player is currently starting a match!"
  duel-sent: "{prefix}&#a6e3a1Sent a {icon} &#fab387{mode} &#a6e3a1duel request to {target_prefix}&#cdd6f4{target_name}&#a6e3a1!"
  duel-no-pending: "{prefix}&#f38ba8You have no pending duel request from &#cba6f7{sender}&#f38ba8!"
  duel-accepted-sender: "{prefix}&#a6e3a1{target_name} accepted your duel request!"
  duel-accepted-target: "{prefix}&#a6e3a1You accepted {sender_name}'s duel request!"
  duel-denied-sender: "{prefix}&#f38ba8{target_name} declined your duel request."
  duel-denied-target: "{prefix}&#f38ba8You declined {sender_name}'s duel request."
  duel-received:
    - ""
    - " &8» &#cba6f7&l1V1 DUEL CHALLENGE"
    - " &8» &#89dcebChallenger: {sender_prefix}&#cdd6f4{sender_name}"
    - " &8» &#89dcebMode: {icon} &#fab387{mode} &8| &#89dcebMap: &#b4befe{map}"
    - " &8» <click:run_command:'/duel accept {sender_name}'><hover:show_text:'&#a6e3a1Click to accept'>&#a6e3a1&l[ACCEPT]</hover></click>  <click:run_command:'/duel deny {sender_name}'><hover:show_text:'&#f38ba8Click to decline'>&#f38ba8&l[DENY]</hover></click>"
    - ""
    
